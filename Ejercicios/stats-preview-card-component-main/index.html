<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Stats preview card component</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <div class="contenedor">
      <div class="contenedor-izquierda">
        <div class="info">
          <h1>Get <strong>insights</strong> that help your business grow.</h1>
          <p>
            Discover the benefits of data analytics <br />
            and make better decisions regarding revenue, customer experience,
            and overall efficiency.
          </p>

        <div class="information-area">
          <div class="first">
            <h2>10k+</h2>
            <p>COMPANIES</p>
          </div>
          <div class="second">
            <h2>314</h2>

            <h2>12m+</h2>
            <p>QUERIES</p>
          </div>
        </div>
      </div>
      <div class="img-container">
        <img src="images/image-header-desktop.jpg" />

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
