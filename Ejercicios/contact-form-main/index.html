<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="assets/css/style.css" />

    <title>Frontend Mentor | Contact form</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <div class="formulario">
      <h1>Contact Us</h1>
      <form novalidate>
        <div class="info">
          <div class="info-name">
            <label for="nombre"> First Name *</label>
            <input id="nombre" type="text" required />
            <span class="error-mensaje"></span>
          </div>
          <div class="apellidos">
            <label for="apellido"> Last Name *</label>
            <input id="apellido" type="text" required />
            <span class="error-mensaje"></span>
          </div>
        </div>
        <div class="email">
          <label for="email">Email Address *</label>
          <input id="email" type="email" required />
          <span class="error-mensaje"></span>
        </div>
        <div class="Query">
          <label for="selector">Query Type*</label>
          <div class="selector" id="selector">
            <div class="izquierda">
              <input id="general" type="radio" name="queryType" required />
              <label for="general">General Enquiry</label>
            </div>
            <div class="derecha">
              <input id="support" type="radio" name="queryType" />
              <label for="support">Support Request </label>
            </div>
          </div>
          <span class="error-mensaje" id="error-queryType"></span>
        </div>
        <div class="mensaje">
          <label for="mensaje">Message</label>
          <textarea id="mensaje" type="text" required></textarea>
          <span class="error-mensaje"> </span>
        </div>
        <div class="consent">
          <input type="checkbox" id="check" required />
          <label for="check">I consent to being contacted by the team*</label>
          <span class="error-mensaje"></span>
        </div>

        <button class="boton">Submit</button>
      </form>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
    <script src="assets/js/code.js"></script>
  </body>
</html>
